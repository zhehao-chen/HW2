provider: openai-compatible
model: gpt-4o-mini
base_url: null
api_key_env: null

# Output cap for one model response. Lower it if your model's limit is smaller.
max_tokens: 8000

# Anthropic only. Thinking effort: null leaves the API default; otherwise low |
# medium | high | xhigh | max. Held fixed across every configuration you compare.
effort: null

# Anthropic only. "default" lets the API re-run a declined request on the model
# Anthropic recommends for that refusal category; null turns it off. The model
# that actually served each call is recorded in the trace and priced.
fallbacks: null

# Hard ceilings, enforced by the harness outside your code.
# Your own loop's token budget must sit below session_token_ceiling.
session_token_ceiling: 400000      # one run
lab_token_ceiling: 4000000         # every run in this lab, summed from runs/_ledger.jsonl

# How many runs the runner executes at once. On a free tier or if you hit rate
# limits, pass --jobs 1 to run.py rather than editing this file.
jobs: 4